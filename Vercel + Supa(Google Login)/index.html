<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div id="checking" class="checking">Checking your session…</div>

  <div id="content" class="card" style="display: none;">
    <div class="success-badge">✓</div>
    <h1 class="title">Login successful</h1>
    <p class="subtitle">You're signed in as:</p>

    <div class="user-box">
      <img id="avatar" src="" alt="avatar" style="display: none;" />
      <div>
        <p id="user-name" class="user-name"></p>
        <p id="user-email" class="user-email"></p>
      </div>
    </div>

    <button id="logout-btn" class="logout-btn">Log out</button>
  </div>

  <script src="supabase-client.js"></script>
  <script src="index.js"></script>
</body>
</html>
