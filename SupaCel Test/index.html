<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Supabase + Vercel Test</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <h1>Supabase + Vercel test</h1>
    <div class="status"><span class="dot" id="statusDot"></span><span id="statusText">Connecting...</span></div>

    <form id="msgForm">
      <input type="text" id="nameInput" placeholder="Your name" required />
      <textarea id="messageInput" placeholder="Write something..." required></textarea>
      <button type="submit" id="submitBtn">Post message</button>
    </form>

    <ul id="msgList">
      <li class="empty">Loading messages...</li>
    </ul>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>
</body>
</html>
